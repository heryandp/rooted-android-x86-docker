name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build Debian package (.deb)
        run: |
          chmod +x emu-root/installers/ubuntu/build-deb.sh
          ./emu-root/installers/ubuntu/build-deb.sh "${{ steps.meta.outputs.version }}"

      - name: Package cross-platform release bundles
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"
          OUT="dist"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT

          # 1. Windows bundle (keeps installers/windows + bin relative paths intact)
          WIN_DIR="${STAGE}/emu-root-windows-${TAG}"
          mkdir -p "${WIN_DIR}/installers/windows" "${WIN_DIR}/bin"
          cp emu-root/installers/windows/install-windows.ps1 "${WIN_DIR}/installers/windows/"
          cp emu-root/bin/emu-root.cmd "${WIN_DIR}/bin/"
          cp emu-root/README.md LICENSE "${WIN_DIR}/"
          (cd "${STAGE}" && zip -rq "${GITHUB_WORKSPACE}/${OUT}/emu-root-windows-${TAG}.zip" "emu-root-windows-${TAG}")

          # 2. macOS (Intel + Apple Silicon) bundle
          MAC_DIR="${STAGE}/emu-root-macos-${TAG}"
          mkdir -p "${MAC_DIR}/installers/macos" "${MAC_DIR}/bin"
          cp emu-root/installers/macos/install-macos.sh "${MAC_DIR}/installers/macos/"
          cp emu-root/bin/emu-root "${MAC_DIR}/bin/"
          chmod +x "${MAC_DIR}/installers/macos/install-macos.sh" "${MAC_DIR}/bin/emu-root"
          cp emu-root/README.md LICENSE "${MAC_DIR}/"
          tar -czf "${OUT}/emu-root-macos-${TAG}.tar.gz" -C "${STAGE}" "emu-root-macos-${TAG}"

          # 3. Redroid + ws-scrcpy Docker VPS bundle
          VPS_DIR="${STAGE}/redroid-docker-${TAG}"
          mkdir -p "${VPS_DIR}"
          cp -r redroid-docker/* redroid-docker/.env.example "${VPS_DIR}/"
          cp LICENSE "${VPS_DIR}/"
          chmod +x "${VPS_DIR}/install-vps.sh" "${VPS_DIR}/scripts/"*.sh
          tar -czf "${OUT}/redroid-docker-${TAG}.tar.gz" -C "${STAGE}" "redroid-docker-${TAG}"

          # 4. SHA256 checksums
          (cd "${OUT}" && sha256sum \
            "emu-root_${VER}_all.deb" \
            "emu-root-windows-${TAG}.zip" \
            "emu-root-macos-${TAG}.tar.gz" \
            "redroid-docker-${TAG}.tar.gz" > SHA256SUMS.txt)

          ls -lh "${OUT}"
          cat "${OUT}/SHA256SUMS.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"

          cat > /tmp/release-notes.md <<EOF
          ## 🤖 Rooted Android 12 Release \`${TAG}\`

          Ready-to-use installers and packages for both **local \`emu-root\`** (Windows, macOS Intel & Apple Silicon, Ubuntu/Debian) and **cloud VPS \`redroid-docker\`** (Android 12 + Magisk + MindTheGapps + \`libndk\` ARM64 + \`ws-scrcpy\` + Nginx Basic Auth).

          ### 📦 Included Assets

          | Asset | Platform | Quick Usage |
          |---|---|---|
          | \`emu-root_${VER}_all.deb\` | Ubuntu / Debian | \`sudo apt install ./emu-root_${VER}_all.deb && emu-root --setup\` |
          | \`emu-root-windows-${TAG}.zip\` | Windows 10/11 | Extract & run \`powershell -ExecutionPolicy Bypass -File .\\installers\\windows\\install-windows.ps1\` |
          | \`emu-root-macos-${TAG}.tar.gz\` | macOS (Intel & Apple Silicon) | Extract & run \`./installers/macos/install-macos.sh\` |
          | \`redroid-docker-${TAG}.tar.gz\` | Linux VPS (No KVM required) | Extract & run \`./install-vps.sh --full --expose-nginx\` |
          | \`SHA256SUMS.txt\` | All | Verify downloads with \`sha256sum -c SHA256SUMS.txt\` |

          ### 🔒 Security Highlights
          - ADB port \`5555\` in \`redroid-docker\` is locked to \`127.0.0.1\` by default.
          - Public Web UI access (\`ws-scrcpy\`) uses Nginx reverse proxy with HTTP Basic Auth.
          - Includes \`AGENTS.md\` with operating guidelines for AI agents.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG}" dist/* \
              --title "Rooted Android 12 (${TAG})" \
              --notes-file /tmp/release-notes.md
          fi
